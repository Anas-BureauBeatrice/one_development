<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspired by You</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <!-- Preload CSS and images for faster loading -->
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="Assets/1ST SCREEN/PICTURE 1_1@2x.png" as="image">
    <link rel="preload" href="Assets/1ST SCREEN/PICTURE 2_1@2x.png" as="image">
    <link rel="preload" href="Assets/1ST SCREEN/PICTURE 3_1@2x.png" as="image">

    <script>
        // Preload the pages to make navigation faster
        const preloadPages = () => {
            const pages = ['nature.html', 'city.html', 'beach.html'];
            pages.forEach(page => {
                fetch(page).then(response => response.text());
            });
        };

        document.addEventListener('DOMContentLoaded', () => {
            preloadPages();

            // Add fade-in effect when the page loads
            const container = document.querySelector('.container');
            container.classList.add('fade-in');
        });

        // Function to track clicks and navigate instantly
        function trackClick(event, imageName) {
            // Prevent the default behavior temporarily
            event.preventDefault();
    
            console.log('Tracking click for:', imageName);
    
            // Send POST request asynchronously without blocking navigation
            fetch('https://one-development.onrender.com/click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image_name: imageName })
            }).then(response => {
                return response.json();
            }).then(data => {
                console.log(data);
            }).catch(error => {
                console.error('Error:', error);
            });

            // Navigate immediately
            const pages = {
                'nature': 'nature.html',
                'city': 'city.html',
                'beach': 'beach.html'
            };

            // Add fade-out transition before navigation
            const container = document.querySelector('.container');
            container.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = pages[imageName];
            }, 300); // wait for the fade-out to finish
        }
    </script>
    
    <style>
        /* Smooth transitions for page elements */
        .container {
            opacity: 0; /* Start with 0 opacity for fade-in */
            transition: opacity 0.5s;
        }

        .fade-in {
            opacity: 1;
        }

        .fade-out {
            opacity: 0;
        }

        /* Improved loading visual */
        .image-gallery img {
            transition: transform 0.3s ease;
        }

        .image-gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="Assets/1ST SCREEN/LOGO AND LOCKUP@2x.png" alt="ONE Development Logo" class="logo" loading="lazy">
        </div>
        <div class="image-gallery">
            <a href="nature.html" onclick="trackClick(event, 'nature')" aria-label="Nature Image">
                <img src="Assets/1ST SCREEN/PICTURE 1_1@2x.png" alt="Nature Image" loading="lazy">
            </a>
            <a href="city.html" onclick="trackClick(event, 'city')" aria-label="City Image">
                <img src="Assets/1ST SCREEN/PICTURE 2_1@2x.png" alt="City Image" loading="lazy">
            </a>
            <a href="beach.html" onclick="trackClick(event, 'beach')" aria-label="Beach Image">
                <img src="Assets/1ST SCREEN/PICTURE 3_1@2x.png" alt="Beach Image" loading="lazy">
            </a>
        </div>
        
        <div class="subtitle">Which picture inspires you?</div>
        <div class="subtitle-arabic">أي صورة تلهمكم؟</div>
    </div>
</body>
</html>
