<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspired by You</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <!-- Preload CSS and images for faster loading -->
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="Assets/1ST SCREEN/PICTURE 1_1@2x.png" as="image">
    <link rel="preload" href="Assets/1ST SCREEN/PICTURE 2_1@2x.png" as="image">
    <link rel="preload" href="Assets/1ST SCREEN/PICTURE 3_1@2x.png" as="image">

    <script>
        // Preload the pages to make navigation faster
        const preloadPages = () => {
            const pages = ['nature.html', 'city.html', 'beach.html'];
            pages.forEach(page => {
                fetch(page).then(response => response.text());
            });
        };

        document.addEventListener('DOMContentLoaded', preloadPages);

        // Function to track clicks and navigate faster
        async function trackClick(event, imageName) {
            // Prevent the default behavior temporarily
            event.preventDefault();
    
            console.log('Tracking click for:', imageName);
    
            try {
                const response = await fetch('https://one-development.onrender.com/click', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ image_name: imageName })
                });
    
                const data = await response.json();
                console.log(data);
    
            } catch (error) {
                console.error('Error:', error);
            } finally {
                // Use dynamic content loading instead of full page navigation
                navigateToPage(imageName);
            }
        }

        // Function to dynamically load page content for a SPA-like experience
        async function navigateToPage(pageKey) {
            const pages = {
                'nature': 'nature.html',
                'city': 'city.html',
                'beach': 'beach.html'
            };

            const pageUrl = pages[pageKey];

            // Load the content dynamically without full page reload
            try {
                const response = await fetch(pageUrl);
                const html = await response.text();

                // Replace the body content
                document.body.innerHTML = html;

                // Scroll to top of the page (optional)
                window.scrollTo(0, 0);

            } catch (error) {
                console.error('Error loading page:', error);
            }
        }
    </script>

    <style>
        /* Smooth transitions for page elements */
        .container {
            transition: opacity 0.5s;
        }

        .hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="Assets/1ST SCREEN/LOGO AND LOCKUP@2x.png" alt="ONE Development Logo" class="logo" loading="lazy">
        </div>
        <div class="image-gallery">
            <a href="nature.html" onclick="trackClick(event, 'nature')">
                <img src="Assets/1ST SCREEN/PICTURE 1_1@2x.png" alt="Nature Image" loading="lazy">
            </a>
            <a href="city.html" onclick="trackClick(event, 'city')">
                <img src="Assets/1ST SCREEN/PICTURE 2_1@2x.png" alt="City Image" loading="lazy">
            </a>
            <a href="beach.html" onclick="trackClick(event, 'beach')">
                <img src="Assets/1ST SCREEN/PICTURE 3_1@2x.png" alt="Beach Image" loading="lazy">
            </a>
        </div>
        
        <div class="subtitle">Which picture inspires you?</div>
        <div class="subtitle-arabic">أي صورة تلهمكم؟</div>
    </div>
</body>
</html>
